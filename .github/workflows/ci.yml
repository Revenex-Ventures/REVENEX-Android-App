name: Revenex CI and Demo Deployment

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server security and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            supabase/tests/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - name: Credential scan including Git history
        run: python3 scripts/check_secrets.py --history
      - name: Check maintained documentation links
        run: python3 scripts/check_docs.py
      - name: Install active demo test dependencies
        run: npm ci --ignore-scripts --prefix supabase/tests
      - name: Audit active demo Node dependencies
        run: npm audit --prefix supabase/tests --audit-level=high
      - name: Check Edge Function types
        run: deno check supabase/functions/revenex-ai/index.ts supabase/functions/razorpay-payments/index.ts supabase/functions/inspect-document/index.ts
      - name: Lint Edge Functions
        run: deno lint supabase/functions/revenex-ai supabase/functions/razorpay-payments supabase/functions/inspect-document
      - name: Exercise real Deno entrypoint and server prompt loading
        run: deno test --allow-read=supabase/functions --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,OPENAI_API_KEY,OPENAI_MODEL,REVENEX_AI_ENABLED --allow-net=127.0.0.1 supabase/tests/assistant-entrypoint.test.mjs
      - name: Hosted verification tool regression tests
        run: python3 -m unittest discover -s supabase/tests -p test_verify_hosted.py
      - name: Schema and row-level security tests
        run: npm test --prefix supabase/tests
      - name: AI and payment handler security tests
        run: node --test supabase/tests/assistant-edge.test.mjs supabase/tests/razorpay-edge.test.mjs

  android:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Configure public Supabase values only
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/write_public_android_config.py
      - name: Build and run Android quality checks
        run: |
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' --no-daemon --no-configuration-cache --no-parallel --max-workers=2 -Proborazzi.test.record=true assembleDebug assembleReview testDebugUnitTest lintDebug lintReview verifyNoFirebaseDependencies --console=plain
      - name: Verify server prompt and private configuration stay out of APK
        run: |
          python3 scripts/check_apk_boundary.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check_apk_boundary.py app/build/outputs/apk/review/app-review.apk
      - name: Upload tested demo APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Revenex-demo-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload side-by-side review APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Revenex-review-${{ github.sha }}
          path: app/build/outputs/apk/review/app-review.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy-demo:
    name: Deploy verified Supabase demo functions
    needs: [backend, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_SUPABASE_DEPLOY == 'true' && vars.BACKEND_HARDENING_SCHEMA_CONFIRMED == '24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-demo
    concurrency:
      group: supabase-demo-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.121.0
      - name: Deploy server code after quality gates pass
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Configure the deployment environment token.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Configure the demo project reference.'; exit 1; }
          supabase functions deploy razorpay-payments --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy inspect-document --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy revenex-ai --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify deployed handlers reject anonymous requests
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/check_deployed_functions.py
